<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Segnapunti Freccette v1.2</title>
<style>
:root{--felt:#0f2a22;--felt2:#17382d;--line:#2c5444;--bone:#ece6d3;--mute:#9db3a6;--brass:#d0a84e;--red:#e2483d;--ok:#6fc28a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--felt);color:var(--bone);font-family:Bahnschrift,"Segoe UI",Roboto,system-ui,sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{position:fixed;top:0;left:0;right:0;z-index:8;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--felt);transition:transform .22s ease}
body.header-hidden header{transform:translateY(-110%)}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0;font-weight:600;letter-spacing:.02em}
nav{display:flex;gap:6px;flex-wrap:wrap}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--felt2);border-radius:8px;padding:10px 14px;min-height:44px}
button:hover{border-color:var(--brass)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
nav button.on{background:var(--brass);color:#1b1608;border-color:var(--brass);font-weight:600}
nav button#aud[aria-pressed="false"]{color:var(--mute)}
.audbox{position:relative;display:flex;border:1px solid var(--line);border-radius:8px;background:var(--felt2)}
.audbox:hover{border-color:var(--brass)}
.audbox button{border:0;background:none;border-radius:0}
.audbox #aud{border-radius:8px 0 0 8px}
.audbox #vm{border-left:1px solid var(--line);padding:10px 10px;border-radius:0 8px 8px 0}
.menu{position:absolute;top:calc(100% + 4px);left:0;min-width:100%;max-height:240px;overflow:auto;background:var(--felt2);border:1px solid var(--brass);border-radius:8px;z-index:4;padding:4px;display:flex;flex-direction:column}
.menu[hidden]{display:none}
.menu button{border:0;background:none;text-align:left;white-space:nowrap;min-height:40px;border-radius:6px}
.menu button:hover{background:var(--line)}
.menu .ck{display:inline-block;width:1.3em}
.audbox .menu{min-width:190px}
main{max-width:760px;margin:0 auto;padding:16px}
body:not(.header-hidden) main{padding-top:calc(var(--header-height,72px) + 16px)}
h2{font-size:1.05rem;margin:22px 0 8px;font-weight:600}
label.f{display:block;margin:12px 0 4px;color:var(--mute);font-size:.9rem}
input[type=text]{width:100%;padding:11px 12px;background:var(--felt2);border:1px solid var(--line);border-radius:8px}
.sel{width:100%;padding:11px;background:var(--felt2);border:1px solid var(--line);border-radius:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button.on{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass);font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.go{width:100%;margin-top:22px;background:var(--brass);color:#1b1608;font-weight:700;border-color:var(--brass);font-size:1.05rem}
.err{color:var(--red);margin-top:10px;min-height:1.2em}
.dng{border-color:var(--red);color:var(--red)}
.dng:hover{border-color:var(--red);background:rgba(226,72,61,.12)}
/* avatar */
.av{display:inline-flex;align-items:center;justify-content:center;flex:none;overflow:hidden;border-radius:50%;object-fit:cover;background:var(--line);color:var(--bone);font-weight:700;width:44px;height:44px;font-size:1rem;border:1px solid var(--line)}
.av.s{width:28px;height:28px;font-size:.72rem}
.av.m{width:36px;height:36px;font-size:.88rem}
.av.l{width:96px;height:96px;font-size:2rem}
/* partita */
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--felt2);text-align:center}
.pl.active{border:2px solid var(--brass);padding:11px}
.pn{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0}
.pl .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pl .sc{font-size:clamp(3rem,15vw,5.2rem);line-height:1.05;font-weight:700;font-variant-numeric:tabular-nums}
.pl.active .sc{color:var(--brass)}
.pl .sm{color:var(--mute);font-size:.85rem;line-height:1.5}
.board.mid .sc{font-size:clamp(2.4rem,11vw,4rem)}
.board.many .pl{padding:8px}.board.many .pl.active{padding:7px}
.board.many .sc{font-size:clamp(1.9rem,8.5vw,3.2rem)}
.board.many .sm{font-size:.74rem;line-height:1.4}
.board.many .nm{font-size:.9rem}
@media(min-width:600px){.board.many{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){
 main.wide{max-width:1400px}
 main.wide>:not(.board){max-width:760px;margin-left:auto;margin-right:auto}
 .board.line{grid-template-columns:repeat(var(--n),1fr);gap:14px}
 .board.line .sc{font-size:clamp(3rem,6.5vw,7rem)}
 .board.line .nm{font-size:1.1rem}
 .board.line .sm{font-size:.95rem}
}
.x{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.92}
.bar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:12px 0;color:var(--mute);font-size:.9rem;flex-wrap:wrap}
.co{display:flex;gap:6px;align-items:center;margin:12px 0 0;flex-wrap:wrap;min-height:40px}
.pend{min-height:40px;display:flex;gap:6px;align-items:center;margin:8px 0;flex-wrap:wrap}
.chip{padding:6px 12px;border-radius:99px;border:1px solid var(--brass);font-variant-numeric:tabular-nums}
.chip.buf{border-style:dashed}
.hint{font-size:.82rem;margin:6px 0 0}
.dp{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.dp button{padding:8px 0;min-height:50px;font-size:1.15rem}
.dp button.bl{filter:blur(3px);opacity:.45;pointer-events:none}
.dp button.undo-dart{border-color:var(--red);color:var(--red);font-size:.9rem}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acts button{flex:1}
/* giocatori */
.lst{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;background:var(--felt2);padding:4px 10px 4px 4px;min-height:52px}
.prow.ro{padding:6px 10px}
.prow .ck2{display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex:none;cursor:pointer}
.prow input[type=checkbox]{width:22px;height:22px;accent-color:var(--brass);cursor:pointer;margin:0}
.prow .go2{flex:1;display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;min-width:0;padding:4px 0;min-height:44px}
.prow .go2 .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .go2 .sub{color:var(--mute);font-size:.82rem;white-space:nowrap}
.addbox{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--felt2)}
.addbox .imgrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.ph{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:14px 0 4px}
.ph .acts{margin-top:8px}
.ph .acts button{flex:none}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--felt2)}
.card b{display:block;font-size:1.7rem;font-variant-numeric:tabular-nums;color:var(--brass)}
.card span{color:var(--mute);font-size:.85rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:500}
.cmp td:nth-child(n+2),.cmp th:nth-child(n+2){text-align:center;font-variant-numeric:tabular-nums}
.cmp td.win{color:var(--brass);font-weight:700}
/* tab statistiche: blocchi */
.sbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.home-hero{display:flex;align-items:center;justify-content:center;gap:10px;min-height:180px;border:1px solid var(--line);border-radius:14px;background:var(--felt2);padding:18px}
.home-hero .go{width:min(420px,78%);margin:0;min-height:72px;font-size:1.25rem}
.drawer-btn{width:58px;height:58px;padding:0;font-size:1.35rem}
.game-drawer{position:fixed;inset:0;z-index:20;background:rgba(5,15,11,.72);display:flex;justify-content:flex-end}
.game-drawer[hidden]{display:none}
.game-drawer .panel{width:min(360px,88vw);height:100%;overflow:auto;background:var(--felt2);border-left:1px solid var(--brass);padding:18px}
.game-drawer .panel-head{display:flex;justify-content:space-between;align-items:center}
.empty-state{max-width:520px;margin:70px auto;text-align:center;border:1px solid var(--line);border-radius:14px;padding:28px 18px;background:var(--felt2)}
.empty-state p{color:var(--mute)}
.context-back{margin-bottom:12px}
.match-card{border:1px solid var(--line);border-radius:12px;background:var(--felt2);overflow:hidden;margin:10px 0;cursor:pointer}
.match-card-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.duration-badge{border:1px solid var(--brass);color:var(--brass);border-radius:99px;padding:4px 8px;font-size:.82rem;white-space:nowrap}
.match-card button.match-participants{width:100%;border:0;border-radius:0;background:none;text-align:left;padding:10px 12px}
.match-card button.match-participants:hover{background:var(--line)}
.match-participant{display:flex;align-items:center;gap:8px;padding:5px 0}
.match-participant .rem{margin-left:auto;color:var(--mute);font-variant-numeric:tabular-nums}
.match-participant.winner .name{color:var(--brass);font-weight:700}
.history-boxes{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.history-box{border:1px solid var(--line);border-radius:12px;background:var(--felt2);overflow:hidden}
.history-box-head{width:100%;min-height:48px;border:0;border-radius:0;display:flex;align-items:center;justify-content:space-between;text-align:left;background:none;font-weight:600}
.history-box-body{border-top:1px solid var(--line);padding:10px 12px}
.history-box-body table{table-layout:auto}
.history-box-body th:first-child,.history-box-body td:first-child{text-align:left;min-width:110px}
.history-box-body td,.history-box-body th{text-align:center}
.target-chart{display:flex;flex-direction:column;gap:12px}
.target-player{display:flex;flex-direction:column;gap:6px}
.target-player-name{font-weight:600}
.target-bars{height:190px;display:flex;align-items:flex-end;gap:5px;overflow-x:auto;padding:8px 4px 28px;border-bottom:1px solid var(--line);scroll-behavior:auto}
.target-bars::-webkit-scrollbar{height:0}
.shared-target-scroll{width:100%;height:18px;margin:8px 0 0;display:block}
.target-bar-wrap{height:154px;min-width:28px;flex:1 0 28px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.target-bar{width:100%;max-width:34px;background:var(--brass);border-radius:5px 5px 0 0;min-height:1px}
.target-bar-count{font-size:.72rem;color:var(--bone);margin-bottom:3px;font-variant-numeric:tabular-nums}
.target-bar-label{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:.7rem;white-space:nowrap;color:var(--mute)}
.home-layout{height:calc(100dvh - 32px);display:flex;flex-direction:column;gap:10px;overflow:hidden}
body:not(.header-hidden) .home-layout{height:calc(100dvh - var(--header-height,72px) - 32px)}
.home-layout .home-hero{flex:none;min-height:96px;height:96px}
.home-layout .home-hero.match-active{padding:0}
.match-banner{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:100%;min-height:0;border:0;border-radius:12px;background:rgba(208,168,78,.12);text-align:center;padding:10px}
.match-banner strong{color:var(--brass)}
.match-banner button{white-space:nowrap}
.home-center{flex:1;min-height:0;display:flex;flex-direction:column}
.home-center h2{flex:none;margin:10px 0 8px}
.players-scroll{flex:1;min-height:0;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:6px;background:rgba(23,56,45,.35)}
.players-scroll .lst{gap:6px}
.home-bottom{flex:none}
.home-bottom h2{margin:10px 0 8px}
.home-bottom .addbox{overflow:visible}
.sb{border:1px solid var(--line);border-radius:12px;background:var(--felt2);padding:12px;cursor:pointer;min-width:0}
.sb:hover{border-color:var(--brass)}
.sb.pri,.sb.open{grid-column:1/-1}
.sb.pri{border-color:var(--brass)}
.sb.open{box-shadow:inset 0 0 0 1px var(--brass)}
.sbh{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;background:none;border:0;padding:0;min-height:34px;text-align:left;font-weight:600;font-size:1rem}
.sbh .chev{color:var(--mute);transition:transform .2s;flex:none}
.sb.open .sbh .chev{transform:rotate(180deg)}
.sb .rk{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.sb .rk li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:8px;padding:4px 0;border-top:1px solid var(--line)}
.sb .rk li:first-child{border-top:0}
.sb .rk .pos{color:var(--mute);font-variant-numeric:tabular-nums;text-align:center}
.sb .rk .who{display:flex;align-items:center;gap:8px;min-width:0}
.sb .rk .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb .rk .val{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sb .rk .val b{color:var(--brass);font-size:1.05rem}
.sb .rk .val small{color:var(--mute);margin-left:6px;font-size:.82rem}
.sb .rk li:first-child .who{font-weight:600}
.sb.open .rk li{padding:8px 0}
.sb.open .rk .val b{font-size:1.3rem}
.sb .track{grid-column:2/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:-2px}
.sb .track i{display:block;height:100%;background:var(--brass)}
.sb.pri .val b{font-size:1.2rem}
.sb .more{color:var(--mute);font-size:.8rem;margin:8px 0 0}
@media(max-width:560px){.sbs{grid-template-columns:1fr}}
#ov{position:fixed;inset:0;background:rgba(5,15,11,.82);display:flex;align-items:center;justify-content:center;padding:20px;z-index:5}
#ov[hidden],#toast:empty{display:none}
.dlg{background:var(--felt2);border:1px solid var(--brass);border-radius:14px;padding:20px;max-width:380px;width:100%;text-align:center}
.dlg p{margin:0 0 14px;font-size:1.1rem}
.dlg .acts button{min-width:70px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--brass);color:#1b1608;padding:10px 16px;border-radius:8px;z-index:6;max-width:90%}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:7}
.muted{color:var(--mute)}
@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.dp button{font-size:1rem}}
@media(prefers-reduced-motion:no-preference){.pl.active{transition:border-color .2s}.x{animation:pop .22s ease-out}.x.st{animation:none}@keyframes pop{from{transform:scale(1.25);opacity:0}to{transform:scale(1);opacity:.92}}}
</style>
</head>
<body>
<header><h1>Segnapunti Freccette</h1><div class="header-actions">
<div class="audbox"><button id="aud" data-a="audio" aria-pressed="true">Audio ON</button><button id="vm" data-a="vmenu" aria-label="Scegli la voce" aria-haspopup="true">▾</button><div class="menu" id="vmenu" hidden></div></div>
<button id="headerQuit" class="dng" data-a="quit" hidden>Abbandona partita</button>
<nav>
<button class="on" data-a="tab" data-v="home">Home</button><button data-a="tab" data-v="play">Partita</button><button data-a="tab" data-v="stats">Statistiche</button><button data-a="tab" data-v="history">Storico</button></nav></div></header>
<main id="app"></main>
<div id="ov" hidden></div>
<div id="toast" role="status"></div>
<script>
"use strict";
/* ===== Persistenza: IndexedDB v2 con fallback localStorage ===== */
const Store={db:null,
 async init(){try{this.db=await new Promise((ok,ko)=>{const r=indexedDB.open("segnapunti-freccette",2);
  r.onupgradeneeded=e=>{const d=r.result,old=e.oldVersion;
   if(old<1){d.createObjectStore("players",{keyPath:"id"});d.createObjectStore("matches",{keyPath:"id"})}
   if(old<2){ // migrazione: campo avatar sui giocatori esistenti
    const st=r.transaction.objectStore("players");
    st.openCursor().onsuccess=ev=>{const c=ev.target.result;if(c){const v=c.value;if(typeof v.avatar!=="string"){v.avatar="";c.update(v)}c.continue()}};
   }};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error);r.onblocked=()=>ko(new Error("blocked"))})}catch(e){this.db=null}},
 ls(s){try{return JSON.parse(localStorage.getItem("dt_"+s)||"[]")}catch(e){return[]}},
 clean(s,o){if(s!=="players")return o;const c={...o};delete c.active;return c}, // `active` resta solo in memoria
 all(s){if(!this.db)return Promise.resolve(this.ls(s));
  return new Promise((ok,ko)=>{const r=this.db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)})},
 put(s,o){o=this.clean(s,o);
  if(!this.db){const a=this.ls(s),i=a.findIndex(x=>x.id===o.id);i<0?a.push(o):a[i]=o;
   try{localStorage.setItem("dt_"+s,JSON.stringify(a))}catch(e){}return Promise.resolve()}
  return new Promise((ok,ko)=>{const r=this.db.transaction(s,"readwrite").objectStore(s).put(o);r.onsuccess=()=>ok();r.onerror=()=>ko(r.error)})},
 del(s,id){
  if(!this.db){const a=this.ls(s).filter(x=>x.id!==id);try{localStorage.setItem("dt_"+s,JSON.stringify(a))}catch(e){}return Promise.resolve()}
  return new Promise((ok,ko)=>{const r=this.db.transaction(s,"readwrite").objectStore(s).delete(id);r.onsuccess=()=>ok();r.onerror=()=>ko(r.error)})}
};

/* ===== Modello dati ===== */
const newPlayer=n=>({id:n.toLowerCase(),name:n,avatar:"",totalDartsThrown:0,totalPointsScored:0,first9Points:0,first9Darts:0,
 checkoutAttempts:0,checkoutHits:0,count60plus:0,count100plus:0,count140plus:0,count180:0,highestCheckout:0,active:false});
let PL={};          // giocatori per id
let G=null;         // partita in corso
let view="home";
let PROF=null;      // id del profilo aperto nel tab Giocatori
let CMP_BACK="stats";
let CMP_PROFILE=null;
let NEWNAME="",NEWAV="";
let AUDIO=true;
let VOICE="f";      // f = voce femminile (default), m = voce maschile
let STO={};         // blocchi del tab Statistiche espansi
let HISTORY_DETAIL=null;
let HISTORY_TAB="Leg";
let HISTORY_OPEN={};
let TARGET_EXPAND=false;
const CFG={start:301,out:"straight",gotcha:0,legs:1};
const MAXP=8,MINP=2;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const f1=x=>(isFinite(x)?x:0).toFixed(1);
const sorted=()=>Object.values(PL).sort((a,b)=>a.name.localeCompare(b.name));
const activeList=()=>sorted().filter(p=>p.active);
const low=s=>String(s).toLowerCase();
const rand=n=>{try{const u=new Uint32Array(1);crypto.getRandomValues(u);return u[0]%n}catch(e){return Math.floor(Math.random()*n)}};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function initials(n){const w=n.trim().split(/\s+/).filter(Boolean);return esc((w.length>1?w[0][0]+w[1][0]:n.trim().slice(0,2)).toUpperCase())}
function av(p,sz){return p.avatar?`<img class="av ${sz||""}" src="${esc(p.avatar)}" alt="">`:`<span class="av ${sz||""}" aria-hidden="true">${initials(p.name)}</span>`}
function toast(m){const t=$("#toast");t.textContent=m;clearTimeout(toast.h);toast.h=setTimeout(()=>t.textContent="",2200)}
function ask(msg,btns){const o=$("#ov");o.hidden=false;
 o.innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><p>${msg}</p><div class="acts">${btns.map((b,i)=>`<button data-o="${i}">${b[0]}</button>`).join("")}</div></div>`;
 o.onclick=e=>{const b=e.target.closest("[data-o]");if(!b)return;o.hidden=true;o.innerHTML="";btns[+b.dataset.o][1]()};
 const f=o.querySelector("button");if(f)f.focus()}
function toggleMenu(id){
 document.querySelectorAll(".menu").forEach(m=>{if(m.id!==id)m.hidden=true});
 const m=document.getElementById(id);if(m)m.hidden=!m.hidden;
}

   const ang=(35+Math.random()*45)*Math.PI/180,sp=(14+Math.random()*18)*sc,dir=side?-1:1,life=150+Math.random()*60;

/* ===== Consigli di chiusura ===== */
const DARTS=(()=>{const a=[];for(let n=1;n<=20;n++)for(let m=1;m<=3;m++)a.push({v:n*m,l:(["","","D","T"][m])+n,m});
 a.push({v:25,l:"25",m:1},{v:50,l:"Bull",m:2});return a.sort((x,y)=>y.v-x.v||y.m-x.m)})();
const LASTD=[20,16,8,18,12,10,14,6,4,2,1,19,17,15,13,11,9,7,5,3].map(n=>({v:2*n,l:"D"+n,m:2})).concat({v:50,l:"Bull",m:2});
const LASTS=DARTS.slice().sort((a,b)=>a.m-b.m||b.v-a.v);
function checkout(r,n,dbl){
 if(r<1||(dbl&&r<2))return null;
 const last=dbl?LASTD:LASTS;
 const candidates=[];
 const go=(rem,k,path)=>{
  if(k===1){
   const d=last.find(x=>x.v===rem);
   if(d)candidates.push(path.concat(d));
   return;
  }
  for(const d of DARTS){
   if(d.v>=rem)continue;
   const left=rem-d.v;if(dbl&&left<2)continue;
   go(left,k-1,path.concat(d));
  }
 };
 for(let k=1;k<=n;k++)go(r,k,[]);
 if(!candidates.length)return null;
 let pool=candidates.slice();
 if(dbl){
  const preferred=pool.filter(path=>{
   if(path.length===1)return path[0].v>=10;
   return path.slice(0,-1).every(d=>d.v>=10);
  });
  pool=preferred.length?preferred:pool;
 }
 if(!dbl){
  const preferred=pool.filter(path=>{
   if(path.length===1)return true;
   return path.slice(0,-1).every(d=>d.v>=10);
  });
  pool=preferred.length?preferred:pool;
 }
 pool.sort((a,b)=>{
  const lowA=a.filter((d,i)=>i<a.length-(dbl?1:0)&&d.v<10).length;
  const lowB=b.filter((d,i)=>i<b.length-(dbl?1:0)&&d.v<10).length;
  if(lowA!==lowB)return lowA-lowB;
  return a.length-b.length;
 });
 return pool[0]||null;
}

 if(!G.hist.length)return toast("Niente da annullare");
 const s=JSON.parse(G.hist.pop()),t=G.turns[G.turns.length-1];
 G.rem=s.rem;G.cur=s.cur;G.turns=s.turns;G.bu=s.bu;G.gt=s.gt;
 G.pend=(t&&t.dd?t.dd:[]).slice(0,-1);G.dm=1;
 render();
}
/* Statistiche: regole contatori applicate a un record giocatore.
   count60plus/100plus/140plus/count180 = turni non bust nei range 60-99, 100-139, 140-179, 180.
   checkoutAttempts = turni iniziati con resto <=170 (Double) o <=180 (Straight). */
function applyTurns(r,turns,out){
 const lim=out==="double"?170:180;
 turns.forEach((t,i)=>{
  r.totalDartsThrown+=t.n;r.totalPointsScored+=t.total;
  if(i<3){r.first9Darts+=t.n;r.first9Points+=t.total}
  if(t.startRem<=lim)r.checkoutAttempts++;
  if(t.checkout){r.checkoutHits++;r.highestCheckout=Math.max(r.highestCheckout,t.startRem)}
  if(!t.bust){if(t.total===180)r.count180++;else if(t.total>=140)r.count140plus++;else if(t.total>=100)r.count100plus++;else if(t.total>=60)r.count60plus++}
 });
}
function applyLeg(turns){
 G.pl.forEach((r,p)=>applyTurns(r,turns.filter(t=>t.p===p),G.cfg.out));
}
function flushLegs(){G.legs.forEach(l=>applyLeg(l.turns));G.pl.forEach(r=>Store.put("players",r))}
function endLeg(w){
 const g=G,N=g.pl.length;g.lock=true;
 g.legs.push({winner:w,starter:g.starter,turns:g.turns});g.won[w]++;
 const tally=g.won.join("–");
 celebrate(g.won[w]>=g.cfg.legs);
 if(g.won[w]>=g.cfg.legs){
  g.over=true;render();
  ask(`<b>${esc(g.pl[w].name)}</b> vince la partita ${tally}.<br>Vuoi salvarla nelle statistiche?`,[
   ["Salva",()=>{flushLegs();
    const finalRem={...(g.finalRem||{})};g.pl.forEach((p,i)=>{if(finalRem[p.name]==null)finalRem[p.name]=g.rem[i]});
    Store.put("matches",{id:Date.now(),startedAt:g.startedAt||Date.now(),date:new Date().toISOString(),start:g.cfg.start,out:g.cfg.out,gotcha:g.cfg.gotcha,legsToWin:g.cfg.legs,
     players:g.pl.map(p=>p.name),winner:g.pl[w].name,finalRem,legs:g.legs});
    G=null;render();toast("Partita salvata")}],
   ["Non salvare",()=>{G=null;render();toast("Partita non salvata")}]]);
 }else{
  render();
  ask(`<b>${esc(g.pl[w].name)}</b> vince il leg (${tally})`,[["Prossimo leg",()=>{
   g.leg++;g.starter=(g.starter+1)%N;g.cur=g.starter;g.rem=Array(N).fill(g.cfg.start);g.turns=[];g.pend=[];g.hist=[];g.buf="";
    g.finalRem=g.finalRem||{};g.pl.forEach(p=>g.finalRem[p.name]=g.cfg.start);
   g.bu=Array(N).fill(false);g.gt=Array(N).fill(false);g.sb=Array(N).fill(false);g.sg=Array(N).fill(false);g.dm=1;g.lock=false;render()}]]);
 }
}
function addDart(base){
 if(!G||G.lock||G.over)return;
 const m=base===0?1:G.dm;if(base===25&&m===3)return toast("Il bull non ha il triplo");
 if(base===0)zeroTone();
 const val=base*m,p=G.cur,s=G.rem[p],dbl=G.cfg.out==="double";
 const lab=base===0?"0":base===25?(m===2?"Bull":"25"):(["","","D","T"][m]+base);
 if(G.gt[p]){G.gt=G.gt.slice();G.gt[p]=false} // la croce Gotcha sparisce al lancio della prima freccia
 G.pend.push({v:val,l:lab,m});G.dm=1;
 const sum=G.pend.reduce((a,d)=>a+d.v,0),r=s-sum,d=G.pend.map(x=>x.l),dd=G.pend.map(x=>({...x}));
 if(r<0||(dbl&&r===1)||(r===0&&dbl&&m!==2))return commit({p,s,total:0,bust:true,d,dd});
 if(r===0)return commit({p,s,total:s,n:G.pend.length,d,dd});
 if(m>=2&&base!==0)festive(m); // doppio = 2 colpi, triplo = 3 colpi
 if(G.pend.length===3)return commit({p,s,total:sum,d,dd});
 render();
}

/* ===== Input da tastiera ===== */
function flush(){
 if(!G)return;clearTimeout(G.bt);
 if(G.buf===""||G.lock||G.over)return;
 const n=+G.buf;G.buf="";addDart(n);
}
function typeDigit(c){
 if(!G||G.lock||G.over)return;
 clearTimeout(G.bt);
 if(G.buf===""){
  if(c==="0")return addDart(0);
  if(c==="1"||c==="2"){G.buf=c;G.bt=setTimeout(flush,800);return render()}
  return addDart(+c);
 }
 const n=+(G.buf+c);
 if((n>=10&&n<=20)||n===25){G.buf="";return addDart(n)}
 const first=+G.buf;G.buf="";addDart(first);
 if(G&&!G.lock&&!G.over)typeDigit(c);
}
document.addEventListener("keydown",e=>{
 if(!G||G.over||G.lock||view!=="play"||!$("#ov").hidden)return;
 if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName))return;
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 const k=e.key;
 if(/^\d$/.test(k)){e.preventDefault();typeDigit(k)}
 else if(k==="/"){e.preventDefault();flush();if(!G.lock){G.dm=G.dm===2?1:2;render()}}
 else if(k==="*"){e.preventDefault();flush();if(!G.lock){G.dm=G.dm===3?1:3;render()}}
 else if(k==="b"||k==="B"){e.preventDefault();flush();if(!G.lock)addDart(25)}
 else if(k==="Enter"){if(G.buf){e.preventDefault();flush()}}
 else if(k==="Backspace"){e.preventDefault();undo()}
});

function seg2(a,opts,val){return `<div class="seg">${opts.map(o=>`<button type="button" class="${o[0]==val?"on":""}" aria-pressed="${o[0]==val}" data-a="${a}" data-v="${o[0]}">${o[1]}</button>`).join("")}</div>`}
function matchStarted(m){const x=Number(m.startedAt);if(isFinite(x)&&x>0)return x;const id=Number(m.id);if(isFinite(id)&&id>0)return id;const d=Date.parse(m.date||"");return isFinite(d)?d:0}
function matchDuration(m){const start=matchStarted(m),end=Date.parse(m.date||"");if(!start||!isFinite(end)||end<=start)return "—";const minutes=Math.max(0,Math.floor((end-start)/60000));const h=Math.floor(minutes/60),min=minutes%60;return h?`${h}h ${min}m`:`${min}m`}
function matchRem(m,name,index){
 if(m.finalRem&&typeof m.finalRem==="object"){
  if(!Array.isArray(m.finalRem)&&m.finalRem[name]!=null)return +m.finalRem[name]||0;
  if(Array.isArray(m.finalRem)&&m.finalRem[index]!=null)return +m.finalRem[index]||0;
 }
 const legs=Array.isArray(m.legs)?m.legs:[];
 const turns=legs.flatMap(l=>Array.isArray(l.turns)?l.turns:[]);
 const mine=turns.filter(t=>t.p===index);
 if(low(m.winner||"")===low(name))return 0;
 if(mine.length&&mine[mine.length-1].after!=null)return +mine[mine.length-1].after||0;
 return +m.start||0;
}
function matchPlayerOrder(m){
 const winner=low(m.winner||"");
 return (m.players||[]).map((name,i)=>({name,i,rem:matchRem(m,name,i)}))
  .sort((a,b)=>{
   const aw=low(a.name)===winner,bw=low(b.name)===winner;
   if(aw!==bw)return aw?-1:1;
   if(aw&&bw)return 0;
   return a.rem-b.rem;
  });
}
function syncTargetBars(){
 let syncing=false;
 const charts=Array.from(document.querySelectorAll("[data-target-bars]"));
 const slider=document.querySelector("[data-target-scroll]");
 if(!charts.length||!slider)return;
 const maxChart=Math.max(...charts.map(chart=>chart.scrollWidth-chart.clientWidth));
 slider.max=String(Math.max(1,maxChart));
 slider.value="0";
 slider.oninput=()=>{
  syncing=true;
  const value=+slider.value;
  charts.forEach(chart=>chart.scrollLeft=value);
  requestAnimationFrame(()=>syncing=false);
 };
 charts.forEach(chart=>{
  chart.addEventListener("scroll",()=>{
   if(syncing)return;
   syncing=true;
   const value=chart.scrollLeft;
   slider.value=String(Math.min(value,+slider.max));
   charts.forEach(other=>{if(other!==chart)other.scrollLeft=value});
   requestAnimationFrame(()=>syncing=false);
  },{passive:true});
 });
}
function matchCard(m,open=false){
 const winner=low(m.winner||"");
 const indexes=matchPlayerOrder(m);
 const start=matchStarted(m),date=start?new Date(start).toLocaleString("it-IT",{dateStyle:"medium",timeStyle:"short"}):"Data non disponibile";
 const participants=indexes.map(p=>`<div class="match-participant ${low(p.name)===winner?"winner":""}">${av(PL[low(p.name)]||{name:p.name,avatar:""},"s")}<span class="name">${esc(p.name)}</span><span class="rem">${p.rem} punti</span></div>`).join("");
 return `<article class="match-card" ${open?"":`data-a="match" data-v="${esc(String(m.id))}"`}>
 <div class="match-card-top"><span>${esc(date)}</span><span class="duration-badge">${esc(matchDuration(m))}</span></div>
 <div class="match-participants">${participants}</div></article>`;
}
async function renderHistory(){
 const ms=await Store.all("matches");
 if(view!=="history")return;
 ms.sort((a,b)=>matchStarted(b)-matchStarted(a));
 if(HISTORY_DETAIL!==null){
  const m=ms.find(x=>String(x.id)===String(HISTORY_DETAIL));
  if(!m){HISTORY_DETAIL=null;return renderHistory()}
  const legs=Array.isArray(m.legs)?m.legs:[];
  const all=legs.flatMap(l=>Array.isArray(l.turns)?l.turns:[]);
  const box=(key,title,body)=>{
   const open=HISTORY_OPEN[key]!==false;
   return `<section class="history-box"><button class="history-box-head" data-a="history-box" data-v="${esc(key)}"><span>${title}</span><span>${open?"▴":"▾"}</span></button>${open?`<div class="history-box-body">${body}</div>`:""}</section>`;
  };
  const table=(headers,rows)=>`<table><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr>${rows.map(row=>`<tr>${row.map((v,i)=>`<td>${i===0?esc(v):esc(String(v))}</td>`).join("")}</tr>`).join("")}</table>`;
  let boxes=[];
  if((m.legsToWin||1)>1){
   const legRows=matchPlayerOrder(m).map(({name,i})=>[name,...legs.map(l=>l.winner===i?"1":"0")]);
   const legHeaders=["Giocatore",...legs.map((_,i)=>`Leg ${i+1}`)];
   boxes.push(box("Leg","Leg",table(legHeaders,legRows)));
  }
  boxes.push(box("Frecce","Frecce",table(["Giocatore","Frecce tirate","Doppi %","Tripli %"],matchPlayerOrder(m).map(({name,i})=>{
   const ts=all.filter(t=>t.p===i),darts=ts.reduce((s,t)=>s+(+t.n||0),0),dd=ts.flatMap(t=>t.dd||[]),dbl=dd.filter(d=>d.m===2).length,trp=dd.filter(d=>d.m===3).length;
   return [name,darts,darts?(dbl/darts*100).toFixed(1)+"%":"0.0%",darts?(trp/darts*100).toFixed(1)+"%":"0.0%"];
  }))));
  boxes.push(box("Punteggi","Punteggi",table(["Giocatore","Media 3 frecce","Media primi 9","Turno massimo"],matchPlayerOrder(m).map(({name,i})=>{
    const ts=all.filter(t=>t.p===i),darts=ts.reduce((s,t)=>s+(+t.n||0),0),points=ts.reduce((s,t)=>s+(+t.total||0),0);
    let fd=0,fp=0;for(const t of ts){if(fd>=9)break;const take=Math.min(+t.n||0,9-fd);fd+=take;fp+=take?(+t.total||0)*(take/(+t.n||1)):0}const max=ts.reduce((s,t)=>Math.max(s,+t.total||0),0);
    return [name,darts?f1(points/darts*3):"–",fd?f1(fp/fd*3):"–",max];
  }))));
  boxes.push(box("Punti","Punti",table(["Giocatore","60+","100+","140+","180"],matchPlayerOrder(m).map(({name,i})=>{
    const ts=all.filter(t=>t.p===i&&!t.bust),count=[0,0,0,0];
    ts.forEach(t=>{if(t.total>=180)count[3]++;else if(t.total>=140)count[2]++;else if(t.total>=100)count[1]++;else if(t.total>=60)count[0]++});
    return [name,count[0],count[1],count[2],count[3]];
  }))));
  boxes.push(box("Checkout","Checkout",table(["Giocatore","Tentativi","Successi","Percentuale"],matchPlayerOrder(m).map(({name,i})=>{
    const ts=all.filter(t=>t.p===i),lim=(m.out==="double"?170:180),attempts=ts.filter(t=>t.startRem<=lim).length,hits=ts.filter(t=>t.checkout).length;
    return [name,attempts,hits,attempts?(hits/attempts*100).toFixed(1)+"%":"–"];
  }))));
  const chart=matchPlayerOrder(m).map(({name,i})=>{
    const sectors=["0",...Array.from({length:20},(_,n)=>String(n+1)),"25",...Array.from({length:25},(_,n)=>"D"+(n+1)),...Array.from({length:20},(_,n)=>"T"+(n+1))];
    const counts={};
    sectors.forEach(s=>counts[s]=0);
    all.filter(t=>t.p===i).flatMap(t=>t.dd||[]).forEach(d=>{
     let target=d.l||String(d.v||"");
     if(target==="Bull"||target==="D25")target="D25";
     if(sectors.includes(target))counts[target]++;
    });
    const entries=sectors.map(target=>[target,counts[target]]);
    const preview=entries.slice().sort((a,b)=>b[1]-a[1]||sectors.indexOf(a[0])-sectors.indexOf(b[0])).slice(0,5);
    const shown=TARGET_EXPAND?entries.filter(([,count])=>count>0||TARGET_EXPAND):preview;
    const max=Math.max(...shown.map(([,count])=>count),1);
    const bars=shown.map(([target,count])=>`<div class="target-bar-wrap"><span class="target-bar-count">${count}</span><div class="target-bar" style="height:${count/max*145}px"></div><span class="target-bar-label">${esc(target)}</span></div>`).join("")||'<p class="muted">Nessuna freccia registrata.</p>';
    return `<div class="target-player"><div class="target-player-name">${esc(name)}</div><div class="target-chart"><div class="target-bars" data-target-bars>${bars}</div></div></div>`;
   }).join("")+(TARGET_EXPAND?'<input class="shared-target-scroll" type="range" min="0" max="100" value="0" aria-label="Scorri i settori dei grafici" data-target-scroll>':"")+`<button class="target-expand" data-a="target-expand">${TARGET_EXPAND?"Mostra meno":"Espandi tutti i settori"}</button>`;
  boxes.push(box("Targets","Grafico a barre",chart));
  $("#app").innerHTML=`<button class="context-back" data-a="history-back">← Storico</button>${matchCard(m,true)}<div class="history-boxes">${boxes.join("")}</div>`;
  syncTargetBars();
  return;
 }
 $("#app").innerHTML=`<h2>Storico</h2>${ms.length?ms.map(m=>matchCard(m)).join(""):'<p class="muted">Nessuna partita salvata.</p>'}`;
}
function render(){
 document.querySelectorAll('nav [data-a="tab"]').forEach(b=>b.classList.toggle("on",b.dataset.v===view));
 $("#app").classList.toggle("wide",view==="play"&&!!G);
 const quit=$("#headerQuit");if(quit)quit.hidden=!G;
 document.body.classList.toggle("header-hidden",!!G||window.matchMedia("(max-width: 700px)").matches);
 if(view==="stats")return renderStats();
 if(view==="cmp")return renderCmp();
 if(view==="players")return renderPlayers();
 if(view==="history")return renderHistory();
 if(view==="home")return renderHome();
 if(view==="play")return G?renderGame():$("#app").innerHTML=`<div class="empty-state"><h2>Nessuna partita in corso</h2><p>Avvia una partita dalla Home e configura i giocatori.</p><button class="go" style="margin-top:8px" data-a="go-home">Vai alla Home</button></div>`;
}

/* ===== Azioni giocatori ===== */
function addPlayer(){
 const name=NEWNAME.trim(),err=$("#err");
 if(!name)return err.textContent="Inserisci un nome.";
 if(PL[name.toLowerCase()])return err.textContent="Esiste già un giocatore con questo nome.";
 const p={...newPlayer(name),avatar:NEWAV,active:activeList().length<MAXP};
 PL[p.id]=p;Store.put("players",p);NEWNAME="";NEWAV="";render();toast("Giocatore aggiunto");
}
function deletePlayer(id){
 const p=PL[id];if(!p)return;
 if(G&&G.pl.some(x=>x.id===id))return toast("Giocatore in partita: non eliminabile");
 ask(`Eliminare <b>${esc(p.name)}</b>?<br>Le sue statistiche andranno perse; lo storico delle partite resta.`,[
  ["Elimina",()=>{Store.del("players",id);delete PL[id];PROF=null;render();toast("Giocatore eliminato")}],
  ["Annulla",()=>{}]]);
}

/* ===== Eventi ===== */
let lastHeaderY=window.scrollY;
function headerAutoHide(){
 const shouldHide=!!G||window.matchMedia("(max-width: 700px)").matches;
 if(shouldHide){
  document.body.classList.add("header-hidden");
 }else{
  document.body.classList.remove("header-hidden");
 }
}
window.addEventListener("wheel",e=>{
 if(e.deltaY<0||window.scrollY<lastHeaderY)document.body.classList.remove("header-hidden");
 else if(!!G||window.matchMedia("(max-width: 700px)").matches)document.body.classList.add("header-hidden");
 lastHeaderY=window.scrollY;
},{passive:true});
window.addEventListener("scroll",()=>{
 if(window.scrollY<lastHeaderY)document.body.classList.remove("header-hidden");
 else if(!!G||window.matchMedia("(max-width: 700px)").matches)document.body.classList.add("header-hidden");
 lastHeaderY=window.scrollY;
},{passive:true});
document.addEventListener("input",e=>{if(e.target.id==="np-name")NEWNAME=e.target.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="np-name"){e.preventDefault();addPlayer()}});
document.addEventListener("change",async e=>{
 const t=e.target;
 if(t.id==="sa"){const o=renderCmp.a;renderCmp.a=t.value;if(renderCmp.b===renderCmp.a)renderCmp.b=o;renderCmp()}
 if(t.id==="sb"){const o=renderCmp.b;renderCmp.b=t.value;if(renderCmp.a===renderCmp.b)renderCmp.a=o;renderCmp()}
 if((t.id==="np-file"||t.id==="av-file")&&t.files&&t.files[0]){
  const f=t.files[0],isNew=t.id==="np-file";t.value="";
  try{const d=await resizeImg(f);
   if(isNew){NEWAV=d;render()}
   else if(PROF&&PL[PROF]){PL[PROF].avatar=d;Store.put("players",PL[PROF]);render()}
  }catch(err){toast("Immagine non valida")}
 }
});
document.addEventListener("click",e=>{
 if(!e.target.closest(".audbox"))document.querySelectorAll(".menu").forEach(m=>{m.hidden=true});
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 switch(a){
  case "tab":view=v;PROF=null;render();break;
  case "match":HISTORY_DETAIL=v;HISTORY_TAB="Leg";render();break;
  case "history-back":HISTORY_DETAIL=null;render();break;
  case "history-tab":HISTORY_TAB=v;render();break;
  case "history-box":{const k=v;HISTORY_OPEN[k]=HISTORY_OPEN[k]===undefined?false:!HISTORY_OPEN[k];render();break}
  case "target-expand":TARGET_EXPAND=!TARGET_EXPAND;render();break;
  case "go-home":view="home";render();break;
  case "go-play":view="play";render();break;
  case "start-home":startMatch();break;
  case "drawer-open":{const d=$("#gameDrawer");if(d)d.hidden=false;break}
  case "drawer-close":{const d=$("#gameDrawer");if(d)d.hidden=true;break}
  case "cmp-open":CMP_BACK="stats";CMP_PROFILE=null;renderCmp.a=null;renderCmp.b=null;view="cmp";render();break;
  case "cmp-profile":CMP_BACK="home";CMP_PROFILE=v;renderCmp.a=v;renderCmp.b=null;renderCmp.direct=true;view="cmp";render();break;
  case "cmp-back":view=CMP_BACK==="home"?(CMP_PROFILE?(PROF=CMP_PROFILE,"home"): "home"): "stats";render();break;
  case "audio":AUDIO=!AUDIO;if(!AUDIO&&window.speechSynthesis)speechSynthesis.cancel();renderAudio();break;
  case "vmenu":toggleMenu("vmenu");break;
  case "voice":VOICE=v;renderAudio();$("#vmenu").hidden=true;speak("Cento punti");break;
  case "cfg":CFG[b.dataset.k]=isNaN(v)?v:+v;render();break;
  case "start":startMatch();break;
  case "mult":flush();if(!G.lock){G.dm=G.dm===+v?1:+v;render()}break;
  case "num":flush();addDart(+v);break;
  case "undo":undo();break;
  case "quit":ask("Abbandonare la partita? I leg conclusi restano nelle statistiche.",[["Abbandona",()=>{
   if(G){clearTimeout(G.bt);if(G.legs.length)flushLegs()}
    G=null;view="home";render()}],["Continua",()=>{}]]);break;
  case "act":{const p=PL[v];if(!p)break;
   if(!p.active&&activeList().length>=MAXP)toast("Massimo 8 giocatori");else p.active=!p.active;
   render();const el=document.querySelector('input[data-a="act"][data-v="'+CSS.escape(v)+'"]');if(el)el.focus();break}
  case "prof":PROF=v;render();break;
  case "back":PROF=null;render();break;
  case "addpl":addPlayer();break;
  case "pickimg":{const f=document.getElementById(v);if(f)f.click();break}
  case "clearnew":NEWAV="";render();break;
  case "rmimg":if(PROF&&PL[PROF]){PL[PROF].avatar="";Store.put("players",PL[PROF]);render()}break;
  case "delpl":deletePlayer(PROF);break;
  case "sblk":STO[v]=!STO[v];renderStats();break;
  case "cmpmode":renderCmp.direct=v==="1";renderCmp();break;
 }
});

/* ===== Avvio ===== */
(async()=>{await Store.init();
 const header=document.querySelector("header");
 const updateHeaderHeight=()=>document.documentElement.style.setProperty("--header-height",header.getBoundingClientRect().height+"px");
 updateHeaderHeight();
 if(window.ResizeObserver)new ResizeObserver(updateHeaderHeight).observe(header);
 if(window.speechSynthesis){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{speechSynthesis.getVoices()}}catch(e){}}
 try{(await Store.all("players")).forEach(p=>PL[p.id]={...newPlayer(p.name),...p,avatar:typeof p.avatar==="string"?p.avatar:"",active:false})}catch(e){}
 renderAudio();render();})();
</script>
